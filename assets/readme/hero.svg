<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">LinguaCRM — CRM для школы иностранных языков</title>
  <desc id="heroDesc">Карточка ученика в CRM: этап «Пробный урок», дата пробного с напоминаниями в WhatsApp и SMS, абонемент 6 из 8 уроков и отметка об оплате пакета.</desc>

  <rect width="1200" height="420" rx="26" fill="#0B1220"/>

  <g id="title-block">
    <text x="64" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="2.4" fill="#7C8CA6">CRM ДЛЯ ШКОЛЫ ИНОСТРАННЫХ ЯЗЫКОВ</text>

    <text x="64" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="78" font-weight="700" fill="#F2F6FC">LinguaCRM</text>

    <text x="64" y="242" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="31" fill="#C3CEDE">От заявки до абонемента —</text>
    <text x="64" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="31" fill="#C3CEDE">в одной карточке ученика.</text>

    <text x="64" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#66799A">пробные уроки · абонементы · оплаты · переписка</text>
  </g>

  <g id="deal-card">
    <rect x="648" y="52" width="488" height="316" rx="18" fill="#131C2E" stroke="#22304A" stroke-width="1.5"/>
    <rect x="672" y="80" width="6" height="260" rx="3" fill="#F59E0B"/>

    <rect x="948" y="84" width="160" height="30" rx="15" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.38"/>
    <text x="1028" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19" fill="#F5B851">Пробный урок</text>

    <text x="700" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="28" font-weight="600" fill="#EEF3FA">Мария Петрова</text>
    <text x="700" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19" fill="#8494AC">Английский · уровень B1</text>

    <line x1="700" y1="158" x2="1108" y2="158" stroke="#22304A" stroke-width="1.5"/>

    <text x="700" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.4" fill="#F59E0B">ПРОБНЫЙ УРОК</text>
    <text x="700" y="224" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" fill="#E8EDF5">14 июля, 19:00</text>
    <text x="700" y="252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19" fill="#8494AC">напоминания: WhatsApp · SMS</text>

    <line x1="700" y1="274" x2="1108" y2="274" stroke="#22304A" stroke-width="1.5"/>

    <text x="700" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.4" fill="#22C55E">АБОНЕМЕНТ</text>
    <text x="700" y="338" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" fill="#E8EDF5">6 из 8 уроков</text>
    <text x="1108" y="338" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19" fill="#8494AC">24 000 ₽ оплачено</text>

    <rect x="700" y="352" width="408" height="8" rx="4" fill="#22304A"/>
    <rect x="700" y="352" width="306" height="8" rx="4" fill="#22C55E"/>
  </g>
</svg>
