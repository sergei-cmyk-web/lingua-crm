<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="640" viewBox="0 0 1200 640"
     role="img" aria-labelledby="lcTitle lcDesc">
  <title id="lcTitle">Путь ученика от заявки до списанных уроков</title>
  <desc id="lcDesc">Пять шагов: заявка становится сделкой; пробный урок с автоматическими напоминаниями; счёт на пакет уроков; оплата двигает сделку и открывает абонемент; проведённые уроки списываются с баланса, а на остатке в два урока менеджер получает задачу на продление.</desc>

  <rect width="1200" height="640" rx="26" fill="#0B1220"/>

  <text x="56" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="44" font-weight="700" fill="#F2F6FC">Путь ученика внутри CRM</text>
  <text x="56" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="20" fill="#8494AC">Всё, что специфично для языковой школы, работает из коробки — без доработок и внешних таблиц.</text>

  <g id="step-1" transform="translate(0 124)">
    <rect x="56" y="0" width="1088" height="84" rx="14" fill="#131C2E" stroke="#22304A" stroke-width="1.5"/>
    <rect x="72" y="20" width="6" height="44" rx="3" fill="#3B82F6"/>
    <text x="98" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#66799A">01</text>
    <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="24" font-weight="600" fill="#EAF0F8">Заявка становится сделкой</text>
    <text x="140" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8494AC">Лид-форма сайта или входящее сообщение создают сделку в воронке — без дублей контактов.</text>
  </g>

  <g id="step-2" transform="translate(0 220)">
    <rect x="56" y="0" width="1088" height="84" rx="14" fill="#131C2E" stroke="#22304A" stroke-width="1.5"/>
    <rect x="72" y="20" width="6" height="44" rx="3" fill="#F59E0B"/>
    <text x="98" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#66799A">02</text>
    <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="24" font-weight="600" fill="#EAF0F8">Пробный урок</text>
    <text x="140" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8494AC">Записали дату — напоминания уходят сами: за сутки и за час, в WhatsApp, Telegram или SMS.</text>
  </g>

  <g id="step-3" transform="translate(0 316)">
    <rect x="56" y="0" width="1088" height="84" rx="14" fill="#131C2E" stroke="#22304A" stroke-width="1.5"/>
    <rect x="72" y="20" width="6" height="44" rx="3" fill="#8B5CF6"/>
    <text x="98" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#66799A">03</text>
    <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="24" font-weight="600" fill="#EAF0F8">Счёт на пакет уроков</text>
    <text x="140" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8494AC">Выбрали пакет — CRM собирает ссылку на оплату и текст сообщения клиенту.</text>
  </g>

  <g id="step-4" transform="translate(0 412)">
    <rect x="56" y="0" width="1088" height="84" rx="14" fill="#131C2E" stroke="#22304A" stroke-width="1.5"/>
    <rect x="72" y="20" width="6" height="44" rx="3" fill="#22C55E"/>
    <text x="98" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#66799A">04</text>
    <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="24" font-weight="600" fill="#EAF0F8">Оплата пришла</text>
    <text x="140" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8494AC">Вебхук платёжной системы сам двигает сделку в «Оплачено» и открывает абонемент.</text>
  </g>

  <g id="step-5" transform="translate(0 508)">
    <rect x="56" y="0" width="1088" height="84" rx="14" fill="#131C2E" stroke="#22304A" stroke-width="1.5"/>
    <rect x="72" y="20" width="6" height="44" rx="3" fill="#94A3B8"/>
    <text x="98" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#66799A">05</text>
    <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="24" font-weight="600" fill="#EAF0F8">Уроки списываются, баланс тает</text>
    <text x="140" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8494AC">Провели урок — баланс уменьшился. Осталось два — менеджер получает задачу на продление.</text>
  </g>
</svg>
